name: landing
states: [proposed, landed, refused, withdrawn]
initial: proposed
terminal: [landed, refused, withdrawn]
links:
  lane: { required: true }
  branch: { required: false }
  run: { required: false }           # the run whose work it lands
transitions:
  - { from: proposed, to: landed,    on: landed }
  - { from: proposed, to: refused,   on: refused }
  - { from: proposed, to: withdrawn, on: withdrawn }
